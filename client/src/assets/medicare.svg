  <text x="205" y="208" style="fill:rgb(24, 95, 165);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Georgia, serif;font-size:14px;font-weight:400;text-anchor:start;dominant-baseline:auto">HEALTH &amp; WELLNESS</text>

</svg>